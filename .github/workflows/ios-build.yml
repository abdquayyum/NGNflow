name: iOS Build & Submit

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build iOS and Submit to TestFlight
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"


      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build for iOS (Local on Runner)
        run: EAS_LOCAL_BUILD_SKIP_CLEANUP=1 EAS_NO_VCS=1 eas build --platform ios --local --non-interactive
        
      - name: Dump Xcode Logs
        if: failure()
        run: find /var/folders /tmp /Users -name "*.log" -type f 2>/dev/null -exec tail -n 200 {} +
