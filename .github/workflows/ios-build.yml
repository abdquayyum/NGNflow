name: iOS Build & Submit

on:
  push:
    branches:
      - master
      - main

jobs:
  build:
    name: Build iOS and Submit to TestFlight
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.1"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Setup Expo and EAS CLI
        run: npm install -g eas-cli

      - name: Initialize EAS Project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas init --account olamicreas --non-interactive

      - name: Build for iOS (Local on Runner)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: EAS_NO_VCS=1 eas build --platform ios --local --non-interactive
      - name: Dump Xcode Logs
        if: failure()
        run: find /var/folders /tmp -name "*.log" -type f -exec tail -n 200 {} +

      - name: Submit to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
        run: eas submit --platform ios
